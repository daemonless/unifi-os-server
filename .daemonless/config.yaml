# dbuild configuration file
# Place in .daemonless/config.yaml or .dbuild.yaml (higher priority)
#
# Full reference: https://github.com/daemonless/dbuild

build:
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      # mongodb70 failed in the 15.1 quarterly package run (2026-10-22) and
      # dropped out of that repo; the latest repo has it.
      args:
        BASE_VERSION: "15.1-latest"

cit:
  mode: port
  port: 443
  https: true
  wait: 300
  annotations:
    - org.freebsd.jail.allow.mlock=true
    - org.freebsd.jail.allow.sysvipc=true

# Highly experimental: keep it out of the fjord catalog for now.
fjord:
  exclude: true
